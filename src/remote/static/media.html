<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>查看媒体 · Personal Robot</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="apple-touch-icon" href="/static/favicon.png" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="screen media-screen">
    <header class="top">
      <div class="logo logo-compact" aria-label="Personal Robot">
        <span class="logo-mark">PR</span>
        <span class="logo-text">
          <span class="logo-name">查看媒体</span>
          <span id="authPill" class="pill">检查登录</span>
        </span>
      </div>
      <button id="btnClose" class="ghost" type="button">关闭</button>
    </header>
    <p id="mediaMsg" class="banner" hidden></p>

    <section class="card">
      <h2>分类</h2>
      <div id="catTabs" class="cat-tabs" role="tablist"></div>
    </section>

    <section class="card">
      <h2 id="listTitle">文件 <span id="listCount" class="h2-sub"></span></h2>
      <div id="fileList" class="file-list"></div>
      <p id="emptyHint" class="muted" hidden>此分类暂无文件。</p>
    </section>

    <section id="previewCard" class="card" hidden>
      <h2>预览</h2>
      <div id="previewBody" class="preview-body"></div>
      <div class="row">
        <button id="btnDownload" type="button" class="secondary">下载</button>
        <button id="btnDelete" type="button" class="danger">删除</button>
      </div>
    </section>
  </div>
  <script src="/static/media.js"></script>
</body>
</html>

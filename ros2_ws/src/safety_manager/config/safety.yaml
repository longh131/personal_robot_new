safety_manager:
  ros__parameters:
    cmd_timeout: 0.30
    rate_hz: 20.0
    obstacle.enabled: true
    # 车身/支架自回波约 0.21m，低于 ignore_below 不参与刹停
    obstacle.ignore_below_m: 0.28
    obstacle.stop_m: 0.45
    obstacle.hard_m: 0.30
    obstacle.front_deg: 50.0
    obstacle.angle_offset_deg: 0.0
    obstacle.stale_s: 0.8
